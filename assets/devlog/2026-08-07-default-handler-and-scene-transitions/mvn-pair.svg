<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d"><title id="t">The MVN save and restore pair</title><desc id="d">Sub_0918 copies the $14E0-byte block at $00:0920 (WRAM $7E:0920 through the bank $00 mirror) to $7F:2000 with one MVN, opcode bytes 54 7F 00. Sub_0905 copies it back with 54 00 7F. In the opcode the destination bank comes first; A holds the count minus one, $14DF.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="397" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="391" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="384" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">ONE BLOCK, TWO DIRECTIONS</text>
<rect x="40" y="84" width="220" height="110" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="36" y="80" width="220" height="110" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="146.0" y="110.3" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$00:0920</text>
<text x="146.0" y="135.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >field state</text>
<text x="146.0" y="159.7" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$14E0 bytes</text>
<rect x="348" y="84" width="220" height="110" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="344" y="80" width="220" height="110" rx="3" fill="#6a3a12" stroke="#ffb784" stroke-width="2" />
<text x="454.0" y="110.3" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$7F:2000</text>
<text x="454.0" y="135.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >save buffer</text>
<text x="454.0" y="159.7" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$14E0 bytes</text>
<path d="M262,112 L338,112" fill="none" stroke="#ffd76e" stroke-width="3" stroke-linejoin="miter"/>
<path d="M338.0,112.0 L326.0,119.0 L326.0,105.0 Z" fill="#ffd76e"/>
<text x="300" y="100" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#ffd76e" text-anchor="middle" >save</text>
<path d="M338,160 L262,160" fill="none" stroke="#7fd8f0" stroke-width="3" stroke-linejoin="miter"/>
<path d="M262.0,160.0 L274.0,153.0 L274.0,167.0 Z" fill="#7fd8f0"/>
<text x="300" y="182" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#7fd8f0" text-anchor="middle" >restore</text>
<text x="36" y="248" font-size="17" text-anchor="start"><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="700">Sub_0918 </tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">save:    </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">54 7F 00</tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#cdd5ff" font-weight="400">  MVN $7F,$00</tspan></text>
<text x="36" y="284" font-size="17" text-anchor="start"><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="700">Sub_0905 </tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">restore: </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#7fd8f0" font-weight="700">54 00 7F</tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#cdd5ff" font-weight="400">  MVN $00,$7F</tspan></text>
<text x="36" y="330" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >Opcode $54, then the destination bank, then the source.</text>
<text x="36" y="356" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >A = $14DF (count - 1), X = source, Y = destination.</text></svg>
