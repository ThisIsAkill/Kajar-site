<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 746" width="600" height="746" role="img" aria-labelledby="t d"><title id="t">The screen transition path, step by step</title><desc id="d">Sub_18D9's long path in order: fade out; InitHW; Sub_011B saves the scene (MVN $00:0920 to $7F:2000 and scroll positions to $7F:1Dxx); JSL $C28000 calls into bank $C2; InitHW, InstallNMI and InstallIRQ; Sub_01A5 restores the scene; Sub_1A03 restores colours and scene tables; Sub_B192 clears the $1Bxx table and tail-calls Sub_E935, which marks $0BC0-$0BC7 free; Sub_2824 fades back in over 15 VBlanks.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="743" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="737" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="730" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
