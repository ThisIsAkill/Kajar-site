<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d"><title id="t">What GameLoop clears in WRAM</title><desc id="d">Two bars for WRAM banks $7E and $7F, 64 KB each. GameLoop zero-fills $7E:0000-$04FF, $7E:0700-$FFFF and $7F:5080-$A0FF with DMA. It skips $7E:0500-$06FF, where the NMI and IRQ trampolines installed just before (at $0500 and $0504) must survive. The rest of bank $7F is left alone.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="397" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="391" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="384" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
