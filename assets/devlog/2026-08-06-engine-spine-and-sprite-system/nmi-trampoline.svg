<rect x="114" y="174" width="380" height="72" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="110" y="170" width="380" height="72" rx="3" fill="#5a420c" stroke="#ffd76e" stroke-width="2" />
<text x="300.0" y="193.65" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >NMI_Stub</text>
<text x="300.0" y="218.35" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$00:FF10  JML $000500</text>
