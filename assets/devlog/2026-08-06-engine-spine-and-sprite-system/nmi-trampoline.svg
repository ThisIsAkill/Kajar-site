<rect x="110" y="274" width="380" height="72" rx="3" fill="#6a3a12" stroke="#ffb784" stroke-width="2" />
<text x="300.0" y="297.65" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >Trampoline in WRAM</text>
<text x="300.0" y="322.34999999999997" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$7E:0500  5C 63 EA C0</text>
