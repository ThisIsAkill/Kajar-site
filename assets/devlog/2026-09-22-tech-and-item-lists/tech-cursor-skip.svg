<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">Moving the tech cursor past unavailable entries</title><desc id="d">A tech list shown three rows at a time. The cursor is on list entry 1 (row 1, scroll 0). Entries 2 and 3 are unavailable. Pressing down, TechListNext walks the list 2, 3, 4 and counts 3 steps. It then adds 3 to the row, giving 4; since the window has rows 0 to 2, it scrolls down one and takes one off the row until the row is below 3: scroll 2, row 2. Scroll plus row is 4, the entry it found.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="557" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="551" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="544" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
