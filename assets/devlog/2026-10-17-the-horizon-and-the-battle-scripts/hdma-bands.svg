<text x="495.0" y="279.20000000000005" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >mode 7</text>
<rect x="430" y="304.8" width="130" height="153.60000000000002" rx="0" fill="#173f78" stroke="#8e9ce6" stroke-width="1.5" />
<text x="495.0" y="381.6" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >mode 1</text>
<text x="422" y="100.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="end" dominant-baseline="central" >line 0</text>
<text x="422" y="253.60000000000002" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="end" dominant-baseline="central" >line 96</text>
<text x="422" y="304.8" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="end" dominant-baseline="central" >line 128</text>
<text x="422" y="458.40000000000003" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="end" dominant-baseline="central" >line 224</text>
<text x="495.0" y="84" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffd76e" text-anchor="middle" >the screen</text>
<text x="40" y="356" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" >The console reads the next entry by itself</text>
<text x="40" y="380" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >during each line's blank, so a game can</text>
<text x="40" y="402" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >change the picture partway down</text>
<text x="40" y="424" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >the screen with no code running.</text>
<text x="40" y="446" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >Program 6 does this every frame.</text></svg>
