<text x="40" y="300" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="14" font-weight="400" fill="#cdd5ff" text-anchor="start" >violet: lines to hold it</text>
<text x="40" y="320" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="14" font-weight="400" fill="#cdd5ff" text-anchor="start" >green: the value written</text>
<rect x="430" y="100.0" width="130" height="153.60000000000002" rx="0" fill="#173f78" stroke="#8e9ce6" stroke-width="1.5" />
<text x="495.0" y="176.8" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >mode 1</text>
