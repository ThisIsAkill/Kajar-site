<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="t d"><title id="t">An HDMA table changes a register partway down the screen</title><desc id="d">A toy HDMA table of three entries, each a line count and a value, next to a 224-line screen split into three bands: the first 96 lines use the first value, the next 32 the second, and the rest the third.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="517" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="511" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="504" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">ONE REGISTER, THREE VALUES PER FRAME</text>
<text x="40" y="84" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" >The table (toy values)</text>
<rect x="40" y="100" width="64" height="36" rx="3" fill="#3d2477" stroke="#8e9ce6" stroke-width="2" />
<text x="72.0" y="118.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$60</text>
<rect x="110" y="100" width="64" height="36" rx="3" fill="#1d4a26" stroke="#8e9ce6" stroke-width="2" />
<text x="142.0" y="118.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$01</text>
<text x="188" y="118" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" dominant-baseline="central" >96 lines: mode 1</text>
<rect x="40" y="146" width="64" height="36" rx="3" fill="#3d2477" stroke="#8e9ce6" stroke-width="2" />
<text x="72.0" y="164.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$20</text>
<rect x="110" y="146" width="64" height="36" rx="3" fill="#1d4a26" stroke="#8e9ce6" stroke-width="2" />
<text x="142.0" y="164.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$07</text>
<text x="188" y="164" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" dominant-baseline="central" >32 lines: mode 7</text>
<rect x="40" y="192" width="64" height="36" rx="3" fill="#3d2477" stroke="#8e9ce6" stroke-width="2" />
<text x="72.0" y="210.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$60</text>
<rect x="110" y="192" width="64" height="36" rx="3" fill="#1d4a26" stroke="#8e9ce6" stroke-width="2" />
<text x="142.0" y="210.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$01</text>
<text x="188" y="210" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" dominant-baseline="central" >96 lines: mode 1</text>
<rect x="40" y="238" width="64" height="36" rx="3" fill="#3d2477" stroke="#8e9ce6" stroke-width="2" />
<text x="72.0" y="256.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$00</text>
