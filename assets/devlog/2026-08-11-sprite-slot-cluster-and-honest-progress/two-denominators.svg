<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="t d"><title id="t">Same matched bytes, two denominators</title><desc id="d">16,460 matched bytes drawn against two totals. Against the whole 4,194,304-byte ROM they are a sliver, under 0.4%. Against the estimated 359,278 bytes of 65816 code they are 4.6%.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="427" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="421" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="414" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">16,460 MATCHED BYTES OF ...</text>
<text x="40" y="92" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start" >... the whole ROM (4,194,304)</text>
<text x="560" y="92" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="end" >0.39%</text>
<rect x="40" y="106" width="520" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<rect x="42" y="108" width="3.0" height="40" fill="#8fe07a"/>
<text x="40" y="182" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >mostly graphics, maps, music and text</text>
<text x="40" y="250" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start" >... the game's code (~359,278)</text>
<text x="560" y="250" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="end" >4.6%</text>
<rect x="40" y="264" width="520" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<rect x="42" y="266" width="21.8" height="40" fill="#8fe07a"/>
<text x="40" y="340" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >the denominator that says how much is left to do</text>
<rect x="40" y="372" width="18" height="18" fill="#8fe07a"/>
<text x="68" y="381" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="start" dominant-baseline="central" >matched by 11 August</text></svg>
