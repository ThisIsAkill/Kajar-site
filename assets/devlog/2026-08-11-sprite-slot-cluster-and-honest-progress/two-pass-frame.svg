<text x="300.0" y="108.35000000000001" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$1B00,X &amp; $7F = ?</text>
