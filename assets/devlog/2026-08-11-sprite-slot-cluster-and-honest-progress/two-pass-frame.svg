<text x="442" y="160" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffd76e" text-anchor="start" >1</text>
<rect x="34" y="188" width="260" height="200" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="30" y="184" width="260" height="200" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
