<path d="M146.0,96.0 L134.0,103.0 L134.0,89.0 Z" fill="#cdd5ff"/>
<text x="300" y="530" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="middle" >The second call can come in the same blanking period or a later one.</text></svg>
