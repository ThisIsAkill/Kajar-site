<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">An 8-tile frame built in two calls</title><desc id="d">Sub_CEF5 dispatches on the pass counter in $1B00,X. First call, counter 0: Sub_D28A looks the frame up, claims two slots, copies tiles 0-15, increments the counter and returns C=1. C=1 means call again, so the queue runs it again when there is time, in the same blanking period or a later one. Second call, counter 1: Sub_D30D copies tiles 16-31 into the second slot at base + $200, writes the eight OAM records, increments the counter and returns C=0, done.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="557" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="551" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="544" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">SUB_CEF5: ONE FRAME, TWO PASSES</text>
<rect x="154" y="68" width="300" height="64" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="150" y="64" width="300" height="64" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
