<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-labelledby="t d"><title id="t">Matched, readable, verified</title><desc id="d">Three levels, top to bottom. Matched: the source assembles to the ROM's exact bytes (make diff, tools/verify.py). Readable: tools/lint_readability.py passes, checked in the pre-commit hook: named structures, calls and constants, explicit widths, Entry and Exit lines, a complete callers list. Verified: a reviewer who did not write the routine reads it against the ROM with only the source, the ROM and the style guide, and records a verdict tied to a hash of the routine's source. A verdict of changes goes back to the author for a fix and another round; any later edit to the routine, comments included, sends it back for review.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="697" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="691" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="684" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">THREE LEVELS, ONE COUNTS</text>
<rect x="40" y="68" width="410" height="96" rx="3" fill="#070b2e" opacity=".55"/>
