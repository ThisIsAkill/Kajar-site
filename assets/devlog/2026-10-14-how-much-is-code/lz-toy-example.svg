<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">How a packed stream unpacks</title><desc id="d">A made-up example of the packed format. A control byte $08 says, from bit 0 up, literal, literal, literal, reference, literal. The literals A, B and C are copied out. The reference is the 16-bit value $3003, stored 03 30: in 12-bit mode the low 12 bits are the distance, 3, and the top 4 bits plus 3 the length, 6. Copying 6 bytes from 3 back, one byte at a time, repeats ABC twice, because the copy reads bytes it has just written. Then the literal D. Seven input bytes give ten output bytes.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="557" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="551" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="544" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">LITERALS AND BACK-REFERENCES (TOY DATA)</text>
