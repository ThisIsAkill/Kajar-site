<text x="202" y="158" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#cdd5ff" text-anchor="middle" >'B'</text>
<rect x="238" y="94" width="60" height="44" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
