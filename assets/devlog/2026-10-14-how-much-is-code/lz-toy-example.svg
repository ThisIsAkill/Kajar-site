<text x="161" y="270" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="middle" >bit 2</text>
<rect x="190" y="218" width="42" height="34" rx="3" fill="#6a3a12" stroke="#ffb784" stroke-width="2" />
<text x="211" y="235" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >R</text>
<text x="211" y="270" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="middle" >bit 3</text>
<rect x="240" y="218" width="42" height="34" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="261" y="235" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >L</text>
<text x="261" y="270" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="middle" >bit 4</text>
<text x="300" y="236" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" dominant-baseline="central" >L = literal byte, R = reference</text>
<text x="40" y="312" font-size="16" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffb784" font-weight="700">$3003</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400">: distance = $003 (low 12 bits),</tspan></text>
<text x="40" y="336" font-size="15" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffffff" font-weight="400">       length = 3 + 3 (top 4 bits + 3) = 6</tspan></text>
