<text x="40" y="204" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="start" >Control byte $08 = 0000 1000, read from bit 0:</text>
<rect x="40" y="218" width="42" height="34" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="61" y="235" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >L</text>
