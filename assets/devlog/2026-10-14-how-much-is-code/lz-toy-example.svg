<rect x="90" y="218" width="42" height="34" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="111" y="235" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >L</text>
<text x="111" y="270" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#cdd5ff" text-anchor="middle" >bit 1</text>
<rect x="140" y="218" width="42" height="34" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
