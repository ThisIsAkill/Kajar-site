<rect x="460" y="230" width="40" height="40" rx="2" fill="#6a3a12" stroke="#ffb784" stroke-width="1.5" />
<text x="480" y="250" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >80</text>
