<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">Where the ROM's 4,194,304 bytes come from in the build</title><desc id="d">A bar for the 4,194,304-byte ROM split by what the build makes each byte from: code source, 306,435 bytes; fill, pointers, 70,435 bytes; text, records, 225,266 bytes; scripts, 437,966 bytes; graphics, 1,493,093 bytes; maps, 555,262 bytes; still bytes, 1,105,847 bytes. Packed data is counted at its packed size in the ROM.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="557" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="551" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="544" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
