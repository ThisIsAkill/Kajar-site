<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d"><title id="t">The partner byte of a combo tech</title><desc id="d">Tech ids from $39 up are double or triple techs. Their partner byte holds the first partner's slot in the low nibble and the second partner's slot in the high nibble; a high nibble of $F means there is no second partner, so it is a double tech. The routine places sprite 0 over the caster, sprite 1 over the first partner and, for a triple tech, sprite 2 over the second.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="417" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="411" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="404" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">WHO GETS A HAND</text>
<text x="40" y="84" font-size="17" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">tech id &lt; $39</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400">: one character, one hand</tspan></text>
<text x="40" y="114" font-size="17" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">tech id &gt;= $39</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400">: read the partner byte</tspan></text>
<rect x="84" y="154" width="216" height="90" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="80" y="150" width="216" height="90" rx="3" fill="#3d2477" stroke="#c7a6ff" stroke-width="2" />
<text x="188.0" y="171.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >high nibble</text>
<text x="188.0" y="195.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >2nd partner ($F: none)</text>
<text x="188.0" y="219.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >bits 7-4</text>
<rect x="308" y="154" width="216" height="90" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="304" y="150" width="216" height="90" rx="3" fill="#14505a" stroke="#7fd8f0" stroke-width="2" />
<text x="412.0" y="171.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >low nibble</text>
<text x="412.0" y="195.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >1st partner</text>
<text x="412.0" y="219.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >bits 3-0</text>
<text x="40" y="286" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start" >sprite 0  -&gt; the caster</text>
<text x="40" y="316" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start" >sprite 1  -&gt; 1st partner (double and triple)</text>
<text x="40" y="346" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start" >sprite 2  -&gt; 2nd partner (triple only)</text>
<text x="40" y="386" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >Example: $F1 = partner in slot 1, no second partner.</text></svg>
