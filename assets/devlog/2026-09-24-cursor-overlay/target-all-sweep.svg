<rect x="181" y="220" width="41" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<text x="201" y="240" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >3</text>
<text x="201" y="278" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#8fe07a" text-anchor="middle" >s1</text>
