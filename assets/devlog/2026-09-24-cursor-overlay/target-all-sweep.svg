<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d"><title id="t">How four cursor sprites cover a target-all selection</title><desc id="d">The routine has four cursor sprites. Sprite 0 always marks the first selected target. On one menu rebuild sprites 1 to 3 mark selection-list entries 0 to 2 and $960B is set to 3; on the next they mark entries 3 to 5 and $960B goes back to 0. Entries 6 to 10 of the list are never reached by this sweep.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="467" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="461" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="454" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">THE TARGET-ALL SWEEP</text>
<text x="40" y="86" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" >Rebuild A: entries 0-2</text>
<text x="560" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#ffd76e" text-anchor="end" >then $960B = 3</text>
<rect x="40" y="100" width="41" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<text x="60" y="120" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >0</text>
<text x="60" y="158" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#8fe07a" text-anchor="middle" >s1</text>
