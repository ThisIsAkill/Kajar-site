<text x="295" y="278" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#8fe07a" text-anchor="middle" >s3</text>
<rect x="322" y="220" width="41" height="40" rx="3" fill="#0b1145" stroke="#59609a" stroke-width="2" />
