<text x="40" y="330" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >s1-s3: cursor sprites 1-3. 11 entries: room for 3 + 8 targets.</text>
<text x="40" y="372" font-size="17" text-anchor="start"><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffd76e" font-weight="700">Sprite 0</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400"> stays on the first selected target.</tspan></text>
<text x="40" y="402" font-size="17" text-anchor="start"><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ff8a80" font-weight="700">Entries 6-10</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400"> are never drawn by the sweep.</tspan></text>
<text x="40" y="436" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >So the hands alternate between two groups of targets.</text></svg>
