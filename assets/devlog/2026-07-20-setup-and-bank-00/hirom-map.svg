<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="t d"><title id="t">How HiROM addresses map to the ROM file</title><desc id="d">In HiROM, CPU banks $C0 to $FF each map a whole 64 KB bank of the 4 MB ROM file, so file offset = (bank - $C0) x $10000 + address. Banks $00 to $3F show only the upper half ($8000-$FFFF) of the same ROM bank. Examples: $00:FFFC is file offset $00FFFC, $C0:000E is $00000E, and $FD:C000 is $3DC000.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="497" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="491" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="484" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">HIROM: CPU ADDRESS TO FILE OFFSET</text>
<rect x="36" y="96" width="528" height="50" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<text x="300" y="121" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >CPU banks $C0-$FF, 64 KB each</text>
<text x="36" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#8fe07a" text-anchor="start" >$C0:0000</text>
<text x="564" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#8fe07a" text-anchor="end" >$FF:FFFF</text>
<line x1="36" y1="146" x2="36" y2="236" stroke="#8fe07a" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="564" y1="146" x2="564" y2="236" stroke="#8fe07a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="300" y="176" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="middle" >file offset =</text>
<text x="300" y="202" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffd76e" text-anchor="middle" >(bank - $C0) x $10000 + addr</text>
