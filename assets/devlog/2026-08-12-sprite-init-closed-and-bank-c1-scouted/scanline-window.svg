<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="t d"><title id="t">When the animation queue may build frames</title><desc id="d">A bar for the 262 scanlines of a frame, numbered by the PPU's V counter. Field_ProcessAnimQueue reads the counter before every step. It keeps building while V is below the limit in dp $6B, stops from that line up to line 239, and builds again from line 240, below the visible picture, to the end of the frame.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="357" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="351" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="344" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">FIELD_PROCESSANIMQUEUE'S TIME WINDOW</text>
<rect x="40.0" y="96" width="79.4" height="56" fill="#1d4a26" stroke="#8fe07a" stroke-width="2"/>
<text x="79.69465648854961" y="124" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >build</text>
<rect x="119.4" y="96" width="396.9" height="56" fill="#6b1d1a" stroke="#ff8a80" stroke-width="2"/>
<text x="317.86259541984737" y="124" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >stop: too close to the picture</text>
<rect x="516.3" y="96" width="43.7" height="56" fill="#1d4a26" stroke="#8fe07a" stroke-width="2"/>
<text x="538.1679389312977" y="124" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" ></text>
<line x1="40.0" y1="152" x2="40.0" y2="164" stroke="#cdd5ff" stroke-width="1.5"/>
<text x="40.0" y="184" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >0</text>
<line x1="119.38931297709924" y1="152" x2="119.38931297709924" y2="164" stroke="#cdd5ff" stroke-width="1.5"/>
<text x="119.38931297709924" y="184" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#ffd76e" text-anchor="middle" >[$6B]</text>
<line x1="516.3358778625955" y1="152" x2="516.3358778625955" y2="164" stroke="#cdd5ff" stroke-width="1.5"/>
<text x="516.3358778625955" y="184" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="middle" >240</text>
<line x1="560.0" y1="152" x2="560.0" y2="164" stroke="#cdd5ff" stroke-width="1.5"/>
<text x="560.0" y="184" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="end" >261</text>
<text x="538.1679389312977" y="80" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="700" fill="#8fe07a" text-anchor="middle" >build</text>
<text x="40" y="236" font-size="17" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">V &lt; [$6B]</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">  or  </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">V &gt;= 240</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#ffffff" font-weight="400">  -&gt;  keep building</tspan></text>
<text x="40" y="270" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >The V counter is latched and read again before every step,</text>
<text x="40" y="294" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >so a long build stops as soon as the window closes.</text>
<text x="40" y="330" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="14" font-weight="400" fill="#cdd5ff" text-anchor="start" font-style="italic" >The position of the $6B limit is drawn as an example.</text></svg>
