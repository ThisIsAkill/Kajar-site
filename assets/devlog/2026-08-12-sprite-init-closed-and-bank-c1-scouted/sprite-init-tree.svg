<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" width="600" height="710" role="img" aria-labelledby="t d"><title id="t">The sprite-init system as a call tree</title><desc id="d">Field_ProcessAnimQueue ($C0:CA76) runs during blanking and calls Obj_BuildSpriteFrameStep ($C0:CAD9) for the queued object. Bits 0-1 of $1201,X pick the builder: type 0, Sub_CBDC with one slot; type 1, Sub_CEF5, which splits into Sub_D28A and Sub_D30D; type 2, Sub_D4F7, which picks one of six pass routines by pass number (0, 1, 2+) and whether $0D00,X is $68. A second dispatcher, Sub_CB0A, only rewrites the OAM layout through Sub_CDC8, Sub_D124 or Sub_DD28.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="707" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="701" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="694" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
