<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="t d"><title id="t">The packed $C3 module, at run time and in the build</title><desc id="d">At run time C3_BootModule calls Decomp_ToWram, which unpacks the 26,393 bytes at $C3:1313-$C3:7A2B into WRAM $7E:3000-$7E:B57E, 34,175 bytes, and the game jumps there. In the build the direction is reversed: asm/bankC3/packed/module.asm is assembled on its own with base $7E:3000, tools/c3pack.py packs the result with the rebuilt 1989-style packer, and the 26,393 packed bytes are placed back at $C3:1313. They must be the cartridge's bytes exactly.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="637" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="631" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="624" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">$C3:1313 &lt;-&gt; $7E:3000</text>
<text x="40" y="82" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffd76e" text-anchor="start" >In the game</text>
<rect x="44" y="102" width="230" height="84" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="40" y="98" width="230" height="84" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="155.0" y="127.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >ROM $C3:1313</text>
<text x="155.0" y="153.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >26,393 bytes packed</text>
