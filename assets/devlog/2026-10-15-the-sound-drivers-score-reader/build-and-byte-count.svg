<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" width="600" height="770" role="img" aria-labelledby="t d"><title id="t">Where every byte of the built ROM comes from</title><desc id="d">Top: the build. Your own ROM is read once by tools/extract_data.py, which checks its hash and writes assets that stay on your machine. The build repacks the compressed blocks, encodes the text and the records, then assembles the source and the data onto a blank 4 MB image filled with $00 and again onto one filled with $FF; the two must be identical. Bottom: tools/verify.py's count of the 4,194,304 bytes on main: packed 2,349,626; extracted 1,248,980; code from source 306,435; text 202,895; fill 65,391; records 15,933; pointer tables 5,044.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="767" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="761" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="754" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">MAKE BUILD, NO COPY OF THE ROM</text>
<rect x="44" y="68" width="520" height="58" rx="3" fill="#070b2e" opacity=".55"/>
