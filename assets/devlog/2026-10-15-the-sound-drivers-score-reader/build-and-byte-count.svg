<text x="300.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >assets in build/assets/, never committed</text>
