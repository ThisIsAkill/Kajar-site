<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="t d"><title id="t">Where the three slot allocators may claim</title><desc id="d">The table at $0BC0 has eight one-byte entries; $80 marks an entry free. Each allocator scans from entry 0 and claims the first run of free entries it finds. Sub_E952 tries one entry at positions 0 to 3, Sub_E97A two adjacent entries starting at 0 to 2, and Sub_E9AA three starting at 0 or 1, so all three stay inside entries 0 to 3. Entry n is the $200-byte WRAM chunk at $7F:3800 + n x $200.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="517" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="511" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="504" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
