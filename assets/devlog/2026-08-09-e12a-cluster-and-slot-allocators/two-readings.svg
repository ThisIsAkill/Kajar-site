<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d"><title id="t">Ten bytes that decode two ways</title><desc id="d">The bytes 29 FF 07 0A 0A 0A 0A 0A 84 C5 open both Sub_E534 and Sub_E687. With M=1 they read AND #$FF, ORA [$0A], four ASLs and STY $C5. With M=0 they read AND #$07FF, five ASLs and STY $C5. Both readings are ten bytes long and end on the same instruction.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="397" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="391" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="384" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
