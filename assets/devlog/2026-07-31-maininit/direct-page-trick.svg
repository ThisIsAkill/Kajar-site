<text x="36" y="300" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffd76e" text-anchor="start" >Without the DP trick:</text>
<text x="36" y="334" font-size="18" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffffff" font-weight="700">STA $2100</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">   =  </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffffff" font-weight="700">8D 00 21</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">   3 bytes</tspan></text>
<text x="36" y="368" font-size="18" text-anchor="start"><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffffff" font-weight="700">STA $00  </tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">   =  </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffffff" font-weight="700">85 00   </tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#8fe07a" font-weight="400">   2 bytes</tspan></text>
<text x="36" y="416" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >So the source writes the offset ($00) and puts the</text>
<text x="36" y="442" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >register name in a comment (or as INIDISP-$2100).</text></svg>
