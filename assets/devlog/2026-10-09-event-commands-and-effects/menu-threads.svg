<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="t d"><title id="t">The menu's eight cooperative threads</title><desc id="d">Eight thread slots, each with its own 64-byte stack from $0A00: slot 0 at $0A00-$0A3F up to slot 7 at $0BC0-$0BFF. Once a frame, after the menu's NMI upload, Menu_RunThreads walks the slots in order. A slot in use counts its wait down; at zero the thread runs until it calls Menu_Yield (wait one frame), Menu_YieldFrames (wait A frames) or Menu_ThreadEnd (free the slot). A yield saves X, Y, P and D on the thread's own stack and the next slot runs. The data bank is set only at the start of the frame, so each thread starts with whatever bank the one before it left.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="637" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="631" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="624" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
