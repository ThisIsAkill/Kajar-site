<text x="476.0" y="480.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >free the slot</text>
<text x="40" y="538" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >A yield pushes X, Y, P and D on the thread's own stack;</text>
<text x="40" y="560" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >next frame the scheduler restores S and RTSes back in.</text>
<text x="40" y="600" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="700" fill="#ffd76e" text-anchor="start" >DB is set once a frame, not per thread.</text></svg>
