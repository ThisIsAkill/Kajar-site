<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="t d"><title id="t">The same eight bytes, read with M=1 and with M=0</title><desc id="d">Eight bytes from MainInit at $FD:C014: A9 01 85 0D A9 00 85 00. With M=1 (8-bit A) they decode as LDA #$01, STA $0D, LDA #$00, STA $00: four 2-byte instructions. With M=0 (16-bit A) the first LDA takes a 2-byte immediate, so they decode as LDA #$8501, ORA $00A9, STA $00: the instruction boundaries move. A disassembler has to track SEP and REP to know which reading is right.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="517" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="511" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="504" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">ONE BYTE STREAM, TWO READINGS</text>
<text x="52" y="72" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >$FD:C014</text>
<rect x="52" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="80.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >A9</text>
<rect x="114" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="142.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >01</text>
<rect x="176" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="204.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >85</text>
<rect x="238" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="266.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >0D</text>
<rect x="300" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="328.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >A9</text>
<rect x="362" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="390.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >00</text>
<rect x="424" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="452.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >85</text>
<rect x="486" y="84" width="56" height="44" rx="3" fill="#0b1145" stroke="#eef1ff" stroke-width="2" />
<text x="514.0" y="106" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >00</text>
<text x="52" y="176" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#8fe07a" text-anchor="start" >M=1</text>
<text x="212" y="176" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >A is 8-bit (after SEP #$20)</text>
<rect x="52" y="192" width="118" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<line x1="111" y1="198" x2="111" y2="226" stroke="#8fe07a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="111.0" y="256" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >LDA #$01</text>
<rect x="176" y="192" width="118" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<line x1="235" y1="198" x2="235" y2="226" stroke="#8fe07a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="235.0" y="256" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >STA $0D</text>
<rect x="300" y="192" width="118" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<line x1="359" y1="198" x2="359" y2="226" stroke="#8fe07a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="359.0" y="256" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >LDA #$00</text>
<rect x="424" y="192" width="118" height="40" rx="3" fill="#1d4a26" stroke="#8fe07a" stroke-width="2" />
<line x1="483" y1="198" x2="483" y2="226" stroke="#8fe07a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="483.0" y="256" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >STA $00</text>
<text x="52" y="316" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="19" font-weight="700" fill="#ff8a80" text-anchor="start" >M=0</text>
<text x="212" y="316" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >A is 16-bit (after REP #$20)</text>
<rect x="52" y="332" width="180" height="40" rx="3" fill="#6b1d1a" stroke="#ff8a80" stroke-width="2" />
<line x1="111" y1="338" x2="111" y2="366" stroke="#ff8a80" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="173" y1="338" x2="173" y2="366" stroke="#ff8a80" stroke-width="1" stroke-dasharray="3 3"/>
<text x="142.0" y="396" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >LDA #$8501</text>
<rect x="238" y="332" width="180" height="40" rx="3" fill="#6b1d1a" stroke="#ff8a80" stroke-width="2" />
<line x1="297" y1="338" x2="297" y2="366" stroke="#ff8a80" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="359" y1="338" x2="359" y2="366" stroke="#ff8a80" stroke-width="1" stroke-dasharray="3 3"/>
<text x="328.0" y="396" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >ORA $00A9</text>
<rect x="424" y="332" width="118" height="40" rx="3" fill="#6b1d1a" stroke="#ff8a80" stroke-width="2" />
<line x1="483" y1="338" x2="483" y2="366" stroke="#ff8a80" stroke-width="1" stroke-dasharray="3 3"/>
<text x="483.0" y="396" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >STA $00</text>
<text x="300" y="452" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffd76e" text-anchor="middle" >Only the M flag says where an instruction ends.</text>
<text x="300" y="482" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="middle" >The code really runs with M=1 here.</text></svg>
