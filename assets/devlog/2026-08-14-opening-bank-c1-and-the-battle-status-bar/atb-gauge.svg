<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d"><title id="t">How the ATB gauge picks its four tiles</title><desc id="d">Worked example with AtbCur = 40 and AtbMax = 100. 40 x 256 / 100 = 102 by the hardware divider; shifted right 3 that is 12 of 32 units filled, so 20 units are still to fill. 20 / 8 = 2 whole tiles get tile $6F (8 units to fill), the next tile gets $67 + 4, and the last keeps $67 (nothing to fill). The attribute is $2D when AtbCur is non-zero and $29 when it is zero.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="557" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="551" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="544" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">BATTLEUI_DRAWSLOTGAUGEBAR</text>
<text x="40" y="76" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" >AtbCur x 256 / AtbMax</text>
<text x="40" y="100" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >0-256, hardware divide</text>
<text x="410" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="end" >40 x 256 / 100</text>
<text x="440" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >=</text>
<text x="560" y="86" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffd76e" text-anchor="end" >102</text>
<text x="40" y="138" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" >&gt;&gt; 3</text>
<text x="40" y="162" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >units filled, of 32</text>
<text x="410" y="148" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="end" >102 &gt;&gt; 3</text>
<text x="440" y="148" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >=</text>
<text x="560" y="148" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffd76e" text-anchor="end" >12</text>
<text x="40" y="200" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" >32 - filled</text>
<text x="40" y="224" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >units still to fill</text>
<text x="410" y="210" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="end" >32 - 12</text>
<text x="440" y="210" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >=</text>
<text x="560" y="210" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffd76e" text-anchor="end" >20</text>
<text x="40" y="262" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" >/ 8 and mod 8</text>
<text x="40" y="286" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="15" font-weight="400" fill="#cdd5ff" text-anchor="start" >whole tiles, remainder</text>
<text x="410" y="272" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="end" >20 = 2 x 8 + 4</text>
<text x="440" y="272" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="400" fill="#cdd5ff" text-anchor="start" >=</text>
<text x="560" y="272" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#ffd76e" text-anchor="end" >2, 4</text>
<text x="40" y="336" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" >The four tiles, left to right</text>
<rect x="64" y="356" width="110" height="70" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="60" y="352" width="110" height="70" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="115.0" y="375.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$6F</text>
<text x="115.0" y="399.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >8 to fill</text>
<rect x="188" y="356" width="110" height="70" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="184" y="352" width="110" height="70" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="239.0" y="375.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$6F</text>
<text x="239.0" y="399.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >8 to fill</text>
<rect x="312" y="356" width="110" height="70" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="308" y="352" width="110" height="70" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="363.0" y="375.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$67+4</text>
<text x="363.0" y="399.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >4 to fill</text>
<rect x="436" y="356" width="110" height="70" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="432" y="352" width="110" height="70" rx="3" fill="#173f78" stroke="#93b6ff" stroke-width="2" />
<text x="487.0" y="375.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >$67</text>
<text x="487.0" y="399.0" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >full</text>
<text x="40" y="464" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >Each tile number says how many of its 8 units are</text>
<text x="40" y="488" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#cdd5ff" text-anchor="start" >still empty: $67 + n, with $6F for a whole empty tile.</text>
<text x="40" y="528" font-size="16" text-anchor="start"><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400">Attribute: </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">$2D</tspan><tspan font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" fill="#cdd5ff" font-weight="400"> if AtbCur &gt; 0, else </tspan><tspan font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" fill="#ffd76e" font-weight="700">$29</tspan></text></svg>
