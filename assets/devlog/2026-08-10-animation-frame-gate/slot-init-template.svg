<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" role="img" aria-labelledby="t d"><title id="t">The shared shape of a sprite-slot init routine</title><desc id="d">Six steps, top to bottom. 1, the gate: entity type $03 reads its frame from $1301,X, any other type calls Sub_CB3A, and C=0 exits. 2, if the frame equals $0F01,X nothing has changed: C=0, exit. 3, claim 1, 2 or 3 slots with Sub_E952, Sub_E97A or Sub_E9AA; none free exits. 4, copy the tiles: for each 16-bit tile word, bit 14 ($4000) set calls Sub_E534 (mirrored copy), clear calls Sub_E687. 5, write the OAM staging records. 6, INC $1B00,X.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="687" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="681" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="674" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
<text x="48" y="33" font-family="'DejaVu Sans Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#ffd76e" text-anchor="start" dominant-baseline="central" letter-spacing="1">GATE, CHECK, CLAIM, COPY, STAGE, MARK</text>
<rect x="34" y="70" width="400" height="74" rx="3" fill="#070b2e" opacity=".55"/>
<rect x="30" y="66" width="400" height="74" rx="3" fill="#3d2477" stroke="#c7a6ff" stroke-width="2" />
<text x="230.0" y="91.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >1  Gate</text>
<text x="230.0" y="115.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >type $03: frame from $1301,X;  else JSR Sub_CB3A</text>
