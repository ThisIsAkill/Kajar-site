<text x="526.0" y="313.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >C=0</text>
