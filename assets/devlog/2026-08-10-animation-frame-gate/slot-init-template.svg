<text x="230.0" y="315.0" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans',Roboto,sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >Sub_E952 / E97A / E9AA (1, 2, 3)</text>
