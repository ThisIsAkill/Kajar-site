<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="t d"><title id="t">The battle command menu, from dirty flag to committed action</title><desc id="d">Top: the gate. If the flag at $993A is clear, nothing runs; if set, it is cleared and four routines run: DequeueReadyBattler, UpdateWindows, ProcessInput and UpdateCursorOverlay. ProcessInput decides by state: no active character, return; target selection running ($9609 non-zero), TargetSelectInput; the tech or item list open ($95DB), that list's input handler; otherwise the main menu, where left and right change character, up and down move the row, and confirm runs ConfirmCommand. Row 0 Attack sets target mode $07, builds the target list and starts target selection; row 1 opens the tech list; row 2 the item list. Confirming a target runs CommitAction, which writes the 8-byte action record.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="897" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="891" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="884" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
