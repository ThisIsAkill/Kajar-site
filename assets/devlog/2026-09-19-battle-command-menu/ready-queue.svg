<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d"><title id="t">Taking the next character off the ready queue</title><desc id="d">The ready queue is four bytes at $95D6 with a count at $95DA. Example: slots 0, 1 and 2 are waiting, the fourth byte is $FF and the count is 3. DequeueReadyBattler moves slot 0 into the roster, then copies $95D7 to $95D6, $95D8 to $95D7, and $95D8 again to $95D9, and decrements the count to 2. The queue now reads 1, 2, 2, 2: the last byte gets $95D8's value instead of $95D9's, but only the first two count.</desc><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4157c9"/><stop offset=".48" stop-color="#23318f"/><stop offset="1" stop-color="#121a58"/></linearGradient></defs><rect x="1.5" y="1.5" width="597" height="467" rx="9" fill="url(#win)" stroke="#070b2e" stroke-width="3"/><rect x="4.5" y="4.5" width="591" height="461" rx="7" fill="none" stroke="#eef1ff" stroke-width="3"/><rect x="8" y="8" width="584" height="454" rx="5" fill="none" stroke="#8e9ce6" stroke-width="1" opacity=".7"/><rect x="28" y="23" width="10" height="10" fill="#ffd76e"/>
